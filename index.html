<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КТ Магистратура - Тестирование</title>
    <style>
        /* --- СБРОС И БАЗОВЫЕ СТИЛИ --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* --- КОНТЕЙНЕР ПРИЛОЖЕНИЯ --- */
        .app-container {
            background-color: #fff;
            width: 100%;
            max-width: 900px;
            height: 90vh; /* Высота как в модальном окне */
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- ШАПКА --- */
        .header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }

        /* --- ПРОГРЕСС БАР --- */
        .progress-container {
            padding: 10px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #555; /* Темно-серый цвет прогресса */
            width: 10%; /* Начальное значение */
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .counter {
            font-size: 14px;
            color: #555;
            font-weight: 500;
            white-space: nowrap;
        }

        /* --- БЛОК ВОПРОСА --- */
        .content-area {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .question-number {
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .question-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap; /* Сохраняет переносы строк */
        }

        .code-snippet {
            background-color: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #d63384; /* Розоватый оттенок как на скрине для кода */
        }

        /* --- ВАРИАНТЫ ОТВЕТОВ --- */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .option-item {
            background-color: #f3f3f3; /* Светло-серый фон как на скриншоте */
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            font-size: 15px;
            line-height: 1.4;
        }

        .option-item:hover {
            background-color: #e9e9e9;
        }

        .option-item.selected {
            border-color: #b0c4de; /* Легкая обводка при выборе, если нужно */
            background-color: #e3efff;
        }
        
        /* Стиль правильного/неправильного ответа (для проверки) */
        .option-item.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .option-item.incorrect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        /* --- ФУТЕР --- */
        .footer {
            padding: 20px 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            background-color: #fff;
        }

        .btn {
            padding: 10px 25px;
            border-radius: 20px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-back {
            background-color: #e0e0e0;
            color: #666;
        }

        .btn-next {
            background-color: #8cc6ff; /* Голубой цвет как на скрине */
            color: #004085;
            font-weight: 600;
        }

        .btn-next:hover {
            background-color: #7abaff;
        }

        /* Скрытие элементов */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <div class="header">
        <div class="header-title">КТ Магистратура - Базы данных</div>
        <div class="header-icons">
            <span>&#x21AA;</span> <!-- Иконка поделиться -->
            <span>&#x2715;</span> <!-- Иконка крестик -->
        </div>
    </div>

    <!-- Прогресс -->
    <div class="progress-container">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="counter" id="counter">1 из 10</div>
    </div>

    <!-- Контент -->
    <div class="content-area" id="contentArea">
        <!-- Сюда JS будет вставлять вопрос -->
    </div>

    <!-- Футер -->
    <div class="footer">
        <button class="btn btn-back" id="btnBack" disabled>Назад</button>
        <button class="btn btn-next" id="btnNext">Далее</button>
    </div>
</div>

<!-- Подключаем файл с вопросами -->
<script src="questions.js"></script>

<script>
    // --- ЛОГИКА ПРИЛОЖЕНИЯ ---

    let currentQuestionIndex = 0;
    let userAnswers = {}; // Храним ответы пользователя {index: optionIndex}

    // DOM элементы
    const contentArea = document.getElementById('contentArea');
    const counter = document.getElementById('counter');
    const progressBar = document.getElementById('progressBar');
    const btnBack = document.getElementById('btnBack');
    const btnNext = document.getElementById('btnNext');

    // Инициализация
    function init() {
        if (!window.questions || window.questions.length === 0) {
            contentArea.innerHTML = "<p>Ошибка: Вопросы не загружены. Проверьте файл questions.js</p>";
            return;
        }
        loadQuestion(currentQuestionIndex);
        updateNav();
    }

    // Загрузка вопроса
    function loadQuestion(index) {
        const q = window.questions[index];
        
        // Формируем HTML
        let html = `
            <div class="question-number">Вопрос ${index + 1}</div>
            <div class="question-text">${formatText(q.text)}</div>
            <div class="options-list">
        `;

        q.options.forEach((opt, i) => {
            // Проверяем, выбирал ли пользователь этот ответ ранее
            const isSelected = userAnswers[index] === i ? 'selected' : '';
            
            html += `
                <div class="option-item ${isSelected}" onclick="selectOption(${i})">
                    ${String.fromCharCode(65 + i)}. ${opt}
                </div>
            `;
        });

        html += `</div>`;
        contentArea.innerHTML = html;

        // Обновляем прогресс
        const total = window.questions.length;
        counter.textContent = `${index + 1} из ${total}`;
        progressBar.style.width = `${((index + 1) / total) * 100}%`;

        // Настройка кнопок
        btnBack.disabled = index === 0;
        btnNext.textContent = (index === total - 1) ? "Завершить" : "Далее";
    }

    // Функция для выделения кода (жирным/моноширинным) в тексте вопроса
    // Простая замена обратных кавычек на span
    function formatText(text) {
        return text.replace(/`([^`]+)`/g, '<span class="code-snippet">$1</span>');
    }

    // Выбор варианта
    window.selectOption = function(optionIndex) {
        // Сохраняем ответ
        userAnswers[currentQuestionIndex] = optionIndex;
        
        // Визуально обновляем выделение
        const options = document.querySelectorAll('.option-item');
        options.forEach((opt, idx) => {
            if (idx === optionIndex) {
                opt.classList.add('selected');
            } else {
                opt.classList.remove('selected');
            }
        });
    };

    // Навигация
    function updateNav() {
        btnBack.onclick = () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        };

        btnNext.onclick = () => {
            // Проверка, выбран ли ответ (опционально)
            // if (userAnswers[currentQuestionIndex] === undefined) {
            //     alert("Пожалуйста, выберите ответ!");
            //     return;
            // }

            if (currentQuestionIndex < window.questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                finishTest();
            }
        };
    }

    function finishTest() {
        // Подсчет результатов
        let score = 0;
        window.questions.forEach((q, idx) => {
            if (userAnswers[idx] === q.correct) {
                score++;
            }
        });

        // Вывод результата вместо вопроса
        contentArea.innerHTML = `
            <div style="text-align:center; margin-top: 50px;">
                <h2>Тест завершен!</h2>
                <p style="font-size: 20px; margin-top: 20px;">Ваш результат: <strong>${score}</strong> из ${window.questions.length}</p>
                <button class="btn btn-next" style="margin-top:30px;" onclick="location.reload()">Пройти заново</button>
            </div>
        `;
        
        // Скрываем навигацию
        document.querySelector('.footer').style.display = 'none';
        document.querySelector('.progress-container').style.display = 'none';
    }

    // Запуск
    init();

</script>
</body>
</html>
